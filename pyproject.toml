[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter-constellation"
version = "0.1.0"
description = "LoRA fine-tuning from scratch on a tiny numpy transformer, visualized as a terminal constellation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["adapter_constellation*"]
